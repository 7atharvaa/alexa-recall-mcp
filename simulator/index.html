<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Household Memory Bridge - Simulator</title>
<style>
  :root {
    --bg: #0f1117;
    --panel: #171a23;
    --panel-2: #1e222d;
    --line: #2a2f3d;
    --text: #e6e9f0;
    --muted: #98a1b3;
    --accent: #5b8cff;
    --accent-2: #7ee0b8;
    --warn: #ffb454;
    --err: #ff6b6b;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
    flex-wrap: wrap;
  }
  .brand { font-weight: 650; letter-spacing: .2px; }
  .brand small { display:block; color: var(--muted); font-weight: 400; font-size: 12px; }
  .spacer { flex: 1; }
  .who { display: flex; gap: 6px; background: var(--panel-2); padding: 4px; border-radius: 10px; }
  .who button {
    border: 0; background: transparent; color: var(--muted);
    padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 14px;
  }
  .who button.active { background: var(--accent); color: #fff; }
  .status {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12.5px; color: var(--muted);
    padding: 5px 11px; border: 1px solid var(--line); border-radius: 999px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--accent-2); }
  .dot.bad { background: var(--err); }
  main {
    flex: 1; display: grid; grid-template-columns: minmax(340px, 1fr) minmax(380px, 1fr);
    gap: 0; min-height: 0;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
  #chat-panel { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); }
  #log-panel { display: flex; flex-direction: column; min-height: 0; background: #0b0d13; }
  .panel-head {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 18px; border-bottom: 1px solid var(--line);
    font-size: 12px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--muted); background: var(--panel);
  }
  #log { flex: 1; overflow: auto; padding: 14px 18px; }
  .frame {
    border: 1px solid var(--line); border-radius: 10px; margin-bottom: 12px;
    overflow: hidden; background: var(--panel);
  }
  .frame-head {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    background: var(--panel-2); font-family: var(--mono); font-size: 12.5px;
  }
  .frame-head .m { color: var(--accent); font-weight: 600; }
  .frame-head .st { margin-left: auto; color: var(--muted); }
  .frame-body { padding: 10px 12px; font-family: var(--mono); font-size: 12.5px; }
  .frame-body .lbl { color: var(--accent-2); margin: 8px 0 3px; }
  .frame-body .lbl:first-child { margin-top: 0; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; color: #cfd6e4; }
  .empty { color: var(--muted); font-style: italic; }
  #messages { flex: 1; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 78%; padding: 10px 14px; border-radius: 14px; white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg .who { font-size: 11px; color: var(--muted); margin-bottom: 4px; display:block; background:none; padding:0; }
  .msg.user .who { color: #dfe7ff; opacity: .85; }
  .msg.err { border-color: var(--err); color: #ffd7d7; }
  .typing { align-self: flex-start; color: var(--muted); font-style: italic; padding: 4px 0; }
  .tooltag {
    display: inline-block; margin-top: 6px; font-family: var(--mono);
    font-size: 11px; color: var(--accent-2); background: #16281f;
    border: 1px solid #24443a; padding: 1px 7px; border-radius: 999px;
  }
  #composer { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid var(--line); background: var(--panel); }
  #composer input {
    flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); font-size: 15px;
  }
  #composer input:focus { outline: none; border-color: var(--accent); }
  #composer button {
    padding: 11px 18px; border-radius: 10px; border: 0; background: var(--accent);
    color: #fff; font-size: 15px; cursor: pointer; font-weight: 500;
  }
  #composer button:disabled { opacity: .5; cursor: not-allowed; }
  .ghost-btn {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
    padding: 6px 12px; border-radius: 8px; font-size: 12.5px; cursor: pointer;
  }
  .ghost-btn:hover { color: var(--text); border-color: var(--accent); }
  .hints { padding: 0 18px 14px; background: var(--panel); display: flex; gap: 8px; flex-wrap: wrap; }
  .hints button {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--muted);
    padding: 5px 11px; border-radius: 999px; font-size: 12.5px; cursor: pointer;
  }
  .hints button:hover { color: var(--text); border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <div class="brand">
    Household Memory Bridge
    <small>Simulator &mdash; live MCP JSON-RPC traffic</small>
  </div>
  <div class="who" id="who">
    <button data-user="mom" class="active">Mom</button>
    <button data-user="dad">Dad</button>
  </div>
  <div class="spacer"></div>
  <div class="status" id="status">
    <span class="dot" id="dot"></span><span id="status-text">checking...</span>
  </div>
  <button id="clear-log" class="ghost-btn">clear traffic</button>
</header>

<main>
  <section id="chat-panel">
    <div class="panel-head">Conversation</div>
    <div id="messages"></div>
    <div class="hints">
      <button data-say="Remember that Emma is allergic to peanuts">save a fact</button>
      <button data-say="What do you remember about allergies?">recall facts</button>
      <button data-say="Delete fact 1">delete a fact</button>
      <button data-say="Hi">small talk</button>
    </div>
    <div id="composer">
      <input id="input" placeholder="Ask the household memory to remember or recall something..." autocomplete="off">
      <button id="send">Send</button>
    </div>
  </section>

  <section id="log-panel">
    <div class="panel-head">Raw MCP JSON-RPC traffic</div>
    <div id="log"><div class="empty">No traffic yet. Send a message to see the MCP calls.</div></div>
  </section>
</main>
<script>
(function () {
  "use strict";

  var USER = "mom";
  var USER_NAMES = { mom: "Mom", dad: "Dad" };
  var history = [];
  var busy = false;

  var messagesEl = document.getElementById("messages");
  var logEl = document.getElementById("log");
  var inputEl = document.getElementById("input");
  var sendBtn = document.getElementById("send");
  var statusText = document.getElementById("status-text");
  var dot = document.getElementById("dot");

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function pretty(v) {
    if (v === undefined || v === null) return "";
    try { return JSON.stringify(v, null, 2); }
    catch (e) { return String(v); }
  }

  function addMessage(role, text, opts) {
    opts = opts || {};
    var el = document.createElement("div");
    el.className = "msg " + (role === "user" ? "user" : "bot")
      + (opts.error ? " err" : "");
    var who = document.createElement("span");
    who.className = "who";
    who.textContent = role === "user" ? USER_NAMES[USER] : "Assistant";
    el.appendChild(who);
    el.appendChild(document.createTextNode(text || ""));
    if (opts.tool) {
      var tag = document.createElement("span");
      tag.className = "tooltag";
      tag.textContent = "tools/call " + opts.tool;
      el.appendChild(document.createElement("br"));
      el.appendChild(tag);
    }
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return el;
  }

  function addTyping() {
    var el = document.createElement("div");
    el.className = "typing";
    el.id = "typing";
    el.textContent = "talking to the MCP server...";
    messagesEl.appendChild(el);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    var t = document.getElementById("typing");
    if (t) t.remove();
  }
  function clearLogPlaceholder() {
    logEl.innerHTML = '<div class="empty">No traffic yet. Send a message to see the MCP calls.</div>';
  }

  function renderFrame(frame) {
    var wrap = document.createElement("div");
    wrap.className = "frame";

    var head = document.createElement("div");
    head.className = "frame-head";
    var m = document.createElement("span");
    m.className = "m";
    m.textContent = frame.method + (frame.notification ? " (notification)" : "");
    var st = document.createElement("span");
    st.className = "st";
    st.textContent = "HTTP " + (frame.status || 0)
      + (frame.elapsed_ms != null ? " - " + frame.elapsed_ms + "ms" : "");
    head.appendChild(m);
    head.appendChild(st);
    wrap.appendChild(head);

    var body = document.createElement("div");
    body.className = "frame-body";

    function section(label, value) {
      var l = document.createElement("div");
      l.className = "lbl";
      l.textContent = label;
      var pre = document.createElement("pre");
      pre.textContent = value;
      body.appendChild(l);
      body.appendChild(pre);
    }

    section("REQUEST HEADERS", pretty(frame.request_headers));
    section("REQUEST", pretty(frame.request));
    if (frame.error) section("TRANSPORT ERROR", frame.error);
    if (frame.response_headers && Object.keys(frame.response_headers).length) {
      section("RESPONSE HEADERS", pretty(frame.response_headers));
    }
    if (frame.response) {
      section("RESPONSE", pretty(frame.response));
    } else if (frame.raw_body) {
      section("RESPONSE BODY (raw)", frame.raw_body);
    } else if (!frame.notification) {
      section("RESPONSE", "(no body)");
    }

    wrap.appendChild(body);
    logEl.appendChild(wrap);
    logEl.scrollTop = logEl.scrollHeight;
  }
  function setBusy(v) {
    busy = v;
    sendBtn.disabled = v;
    inputEl.disabled = v;
    sendBtn.textContent = v ? "..." : "Send";
  }

  function send(text) {
    text = (text || "").trim();
    if (!text || busy) return;

    addMessage("user", text);
    history.push({ role: "user", content: text });
    setBusy(true);
    addTyping();

    fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: text,
        user_id: USER,
        history: history
      })
    }).then(function (res) {
      return res.json();
    }).then(function (data) {
      removeTyping();
      if (data.frames && data.frames.length) {
        var ph = logEl.querySelector(".empty"); if (ph) logEl.innerHTML = "";
        data.frames.forEach(renderFrame);
      }
      if (!data.ok) {
        addMessage("bot", data.error || "Something went wrong.", { error: true });
      } else {
        addMessage("bot", data.reply, { tool: data.tool });
        history.push({ role: "assistant", content: data.reply });
      }
    }).catch(function (err) {
      removeTyping();
      addMessage("bot", "Network error: " + err, { error: true });
    }).then(function () {
      setBusy(false);
      inputEl.focus();
    });
  }

  function refreshStatus() {
    fetch("/api/status").then(function (r) { return r.json(); })
      .then(function (s) {
        if (s.ok) {
          dot.className = "dot ok";
          statusText.textContent = "MCP connected - "
            + (s.tools ? s.tools.length : 0) + " tools";
        } else {
          dot.className = "dot bad";
          statusText.textContent = "MCP offline"
            + (s.error ? " (" + s.error + ")" : "");
        }
      }).catch(function () {
        dot.className = "dot bad";
        statusText.textContent = "simulator offline";
      });
  }
  // -- wiring -------------------------------------------------------------
  sendBtn.addEventListener("click", function () {
    var v = inputEl.value;
    inputEl.value = "";
    send(v);
  });

  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendBtn.click();
    }
  });

  document.getElementById("who").addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-user]");
    if (!btn) return;
    var buttons = this.querySelectorAll("button[data-user]");
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle("active", buttons[i] === btn);
    }
    USER = btn.getAttribute("data-user");
  });

  document.querySelectorAll(".hints button[data-say]").forEach(function (b) {
    b.addEventListener("click", function () {
      send(b.getAttribute("data-say"));
    });
  });

  document.getElementById("clear-log").addEventListener("click", function () {
    clearLogPlaceholder();
  });

  // -- boot ---------------------------------------------------------------
  addMessage("bot",
    "Hi! I'm the Household Memory Bridge. Tell me something to remember, "
    + "or ask me what the family already knows.");
  refreshStatus();
  setInterval(refreshStatus, 15000);
})();
</script>
</body>
</html>
